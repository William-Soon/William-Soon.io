<!DOCTYPE html>
<html>
<head>
    <title>Welcome Back</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 80px;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
        }

        .google-btn:hover {
            background: #357ae8;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
            transform: translateY(-2px);
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .google-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 3px;
            padding: 3px;
        }

        .signout-btn {
            background: transparent;
            color: #888;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .signout-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 40px 30px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
  <div class="login-container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Lorem ipsum dolor sit amet, consectetur adipiscing elit</p>
    
    <button id="signin" class="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
    
    <button id="signout" class="signout-btn">Sign out</button>
  </div>

  <script>
    const CLIENT_ID = '331319721820-n9v2ppqvdg85ni42v484i7ca8se5eifd.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly';
    let tokenClient;

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) {
            console.error('Token error:', resp);
            alert('Sign-in failed: ' + resp.error);
            return;
          }
          localStorage.setItem('GAPI_ACCESS_TOKEN', resp.access_token);
          console.log('✅ Token saved, redirecting...');
          window.location.href = 'CssTable.html';
        },
      });

      document.getElementById('signin').addEventListener('click', () => {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });

      document.getElementById('signout').addEventListener('click', () => {
        localStorage.removeItem('GAPI_ACCESS_TOKEN');
        alert('Signed out (token removed from localStorage)');
      });

      // Hide signout button initially if no token
      const token = localStorage.getItem('GAPI_ACCESS_TOKEN');
      if (!token) {
        document.getElementById('signout').style.display = 'none';
      }
    };
  </script>
</body>
</html>
