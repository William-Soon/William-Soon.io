<!DOCTYPE html>
<html>
    <head>
        <title>three.js css3d - periodic table</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #000;
                color: #fff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                overflow: hidden;
            }

            a {
                color: #4CAF50;
                text-decoration: none;
            }

            #info {
                position: absolute;
                top: 20px;
                left: 20px;
                font-size: 13px;
                color: #888;
                z-index: 100;
            }

            #container {
                width: 100%;
                height: 100vh;
            }

            /* Navigation buttons at bottom */
            #menu {
                position: absolute;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                z-index: 100;
                background: rgba(0, 0, 0, 0.8);
                padding: 15px 25px;
                border-radius: 8px;
                border: 1px solid #333;
            }

            button {
                color: #4CAF50;
                background: transparent;
                border: 1px solid #4CAF50;
                padding: 10px 20px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
                border-radius: 4px;
                transition: all 0.3s ease;
                text-transform: uppercase;
            }

            button:hover {
                background-color: rgba(76, 175, 80, 0.2);
                box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
            }

            button:active {
                background-color: #4CAF50;
                color: #000;
            }

            /* Color legend on right side */
            #legend {
                position: absolute;
                right: 30px;
                top: 50%;
                transform: translateY(-50%);
                width: 80px;
                z-index: 100;
            }

            #legend-title {
                text-align: center;
                font-size: 11px;
                color: #888;
                margin-bottom: 10px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .legend-bar {
                width: 100%;
                height: 300px;
                background: linear-gradient(to bottom, 
                    #4CAF50 0%,    /* Green */
                    #8BC34A 20%,
                    #CDDC39 40%,
                    #FFC107 60%,
                    #FF9800 80%,
                    #F44336 100%   /* Red */
                );
                border-radius: 8px;
                border: 1px solid #333;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            }

            .legend-labels {
                margin-top: 10px;
                font-size: 11px;
                color: #888;
            }

            .legend-label {
                display: flex;
                justify-content: space-between;
                margin: 5px 0;
            }

            /* Element tiles */
            .element {
                width: 120px;
                height: 160px;
                box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
                border: 2px solid rgba(76, 175, 80, 0.6);
                font-family: 'Segoe UI', sans-serif;
                text-align: center;
                cursor: default;
                border-radius: 8px;
                position: relative;
                overflow: hidden;
                transition: all 0.3s ease;
            }

            .element:hover {
                box-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
                border: 2px solid rgba(76, 175, 80, 1);
                transform: scale(1.05);
            }

            /* Number badge in top-right */
            .element .number {
                position: absolute;
                top: 8px;
                right: 8px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.7);
                background: rgba(0, 0, 0, 0.5);
                padding: 3px 8px;
                border-radius: 12px;
                font-weight: 600;
            }

            /* Profile picture placeholder */
            .element .photo {
                width: 60px;
                height: 60px;
                margin: 25px auto 10px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: 2px solid rgba(255, 255, 255, 0.3);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                font-weight: bold;
                color: #fff;
            }

            /* Name (symbol) */
            .element .symbol {
                font-size: 16px;
                font-weight: 600;
                color: #fff;
                margin: 5px 0;
                text-shadow: 0 0 8px rgba(76, 175, 80, 0.8);
            }

            /* Details (full name + net worth) */
            .element .details {
                font-size: 10px;
                color: rgba(255, 255, 255, 0.6);
                padding: 0 10px;
                line-height: 1.4;
            }

        </style>
    </head>
    <body>

        <div id="info">
            <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> CSS3D Visualization
        </div>

        <div id="container"></div>

        <!-- Color Legend -->
        <div id="legend">
            <div id="legend-title">Net Worth</div>
            <div class="legend-bar"></div>
            <div class="legend-labels">
                <div class="legend-label">
                    <span>HIGH</span>
                    <span>>$200K</span>
                </div>
                <div class="legend-label">
                    <span>MID</span>
                    <span>$100K</span>
                </div>
                <div class="legend-label">
                    <span>LOW</span>
                    <span><$100K</span>
                </div>
            </div>
        </div>

        <!-- Navigation Menu -->
        <div id="menu">
            <button id="table">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>

        <script type="module">

            import * as THREE from 'three';
            import TWEEN from 'three/addons/libs/tween.module.js';
            import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
            import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

            let table = [];
            let camera, scene, renderer;
            let controls;

            const objects = [];
            const targets = { table: [], sphere: [], helix: [], grid: [] };

            // Parse money strings like "$1,234", "120K", "2.5M", "1B"
            function parseMoney(str) {
                if (!str) return 0;
                let s = String(str).replace(/\$/g, '').replace(/,/g, '').trim().toUpperCase();
                let mult = 1;
                if (s.endsWith('K')) { mult = 1000; s = s.slice(0, -1); }
                else if (s.endsWith('M')) { mult = 1000000; s = s.slice(0, -1); }
                else if (s.endsWith('B')) { mult = 1000000000; s = s.slice(0, -1); }
                const n = parseFloat(s);
                return isNaN(n) ? 0 : n * mult;
            }

            // Fetch rows from Google Sheet
            async function fetchSheetRows(spreadsheetId, range = 'Sheet1') {
                const token = localStorage.getItem('GAPI_ACCESS_TOKEN');
                if (token) {
                    const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}?majorDimension=ROWS`;
                    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Sheets API error ${res.status}: ${errText}`);
                    }
                    const json = await res.json();
                    return json.values || [];
                } else {
                    const csvUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&gid=409150227`;
                    const res = await fetch(csvUrl);
                    if (!res.ok) throw new Error('CSV fetch error: ' + res.status);
                    const text = await res.text();
                    return text.trim().split('\n').map(r => r.split(',').map(c => c.trim()));
                }
            }

            // Transform rows into flat array
            function buildTableFromRows(rows) {
                table = [];
                rows.forEach((r, idx) => {
                    const symbol = r[0] || ('#' + (idx + 1));
                    const name = r[1] || '';
                    const net = r[5] || '';
                    const col = (idx % 20) + 1;
                    const row = Math.floor(idx / 20) + 1;
                    table.push(symbol, name, net, col, row);
                });
            }

            // Boot sequence
            (async () => {
                const SPREADSHEET_ID = '1fjnNoc4Hzj_N-TRVl7tdEiO5g6Cb2ClI8quuBpSw-7M';
                const SHEET_NAME = 'Data Template';
                try {
                    const rows = await fetchSheetRows(SPREADSHEET_ID, SHEET_NAME);
                    if (!rows || rows.length === 0) {
                        throw new Error('No data returned from Google Sheet');
                    }
                    buildTableFromRows(rows);
                    console.log('✅ Data loaded:', table.length / 5, 'items');
                } catch (err) {
                    console.error('❌ Data load failed:', err);
                    alert('Failed to load data from Google Sheet.\n\nError: ' + err.message);
                    table = ['Ex', 'Example', '$150K', 1, 1];
                }
                init();
                animate();
            })();

            function init() {
                camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
                camera.position.z = 3000;

                scene = new THREE.Scene();

                // Create tiles
                for (let i = 0; i < table.length; i += 5) {
                    const element = document.createElement('div');
                    element.className = 'element';

                    // Color by Net Worth
                    const netVal = parseMoney(table[i + 2]);
                    let bg;
                    if (netVal <= 100000) {
                        bg = 'linear-gradient(135deg, #F44336 0%, #E91E63 100%)'; // Red
                    } else if (netVal <= 200000) {
                        bg = 'linear-gradient(135deg, #FF9800 0%, #FFC107 100%)'; // Orange
                    } else {
                        bg = 'linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%)'; // Green
                    }
                    element.style.background = bg;

                    // Number badge
                    const number = document.createElement('div');
                    number.className = 'number';
                    number.textContent = (i / 5) + 1;
                    element.appendChild(number);

                    // Photo placeholder (initials)
                    const photo = document.createElement('div');
                    photo.className = 'photo';
                    const initials = table[i].substring(0, 2).toUpperCase();
                    photo.textContent = initials;
                    element.appendChild(photo);

                    // Symbol (short name)
                    const symbol = document.createElement('div');
                    symbol.className = 'symbol';
                    symbol.textContent = table[i];
                    element.appendChild(symbol);

                    // Details (full name + net worth)
                    const details = document.createElement('div');
                    details.className = 'details';
                    details.innerHTML = table[i + 1] + '<br>' + table[i + 2];
                    element.appendChild(details);

                    const objectCSS = new CSS3DObject(element);
                    objectCSS.position.x = Math.random() * 4000 - 2000;
                    objectCSS.position.y = Math.random() * 4000 - 2000;
                    objectCSS.position.z = Math.random() * 4000 - 2000;
                    scene.add(objectCSS);

                    objects.push(objectCSS);

                    // Table layout
                    const object = new THREE.Object3D();
                    const tableCol = table[i + 3];
                    const tableRow = table[i + 4];
                    object.position.x = (tableCol * 140) - (20 * 140 / 2) - 70;
                    object.position.y = -(tableRow * 180) + (10 * 180 / 2) + 90;
                    targets.table.push(object);
                }

                // Sphere layout
                const vector = new THREE.Vector3();
                for (let i = 0, l = objects.length; i < l; i++) {
                    const phi = Math.acos(-1 + (2 * i) / l);
                    const theta = Math.sqrt(l * Math.PI) * phi;
                    const object = new THREE.Object3D();
                    object.position.setFromSphericalCoords(800, phi, theta);
                    vector.copy(object.position).multiplyScalar(2);
                    object.lookAt(vector);
                    targets.sphere.push(object);
                }

                // Double Helix layout
                for (let i = 0, l = objects.length; i < l; i++) {
                    const helixSpacing = 0.35;
                    const thetaBase = i * helixSpacing + Math.PI;
                    const thetaOffset = (i % 2 === 0) ? 0 : Math.PI;
                    const y = -(Math.floor(i / 2) * 16) + 450;
                    const object = new THREE.Object3D();
                    object.position.setFromCylindricalCoords(900, thetaBase + thetaOffset, y);
                    vector.x = object.position.x * 2;
                    vector.y = object.position.y;
                    vector.z = object.position.z * 2;
                    object.lookAt(vector);
                    targets.helix.push(object);
                }

                // Grid layout (5×4×10)
                const dx = 400, dy = 400, dz = 1000;
                const offsetX = (5 - 1) * dx / 2;
                const offsetY = (4 - 1) * dy / 2;
                const offsetZ = (10 - 1) * dz / 2;
                for (let i = 0; i < objects.length; i++) {
                    const object = new THREE.Object3D();
                    const x = ((i % 5) * dx) - offsetX;
                    const y = (-(Math.floor(i / 5) % 4) * dy) + offsetY;
                    const z = (Math.floor(i / 20) * dz) - offsetZ;
                    object.position.x = x;
                    object.position.y = y;
                    object.position.z = z;
                    targets.grid.push(object);
                }

                renderer = new CSS3DRenderer();
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.getElementById('container').appendChild(renderer.domElement);

                controls = new TrackballControls(camera, renderer.domElement);
                controls.minDistance = 500;
                controls.maxDistance = 6000;
                controls.addEventListener('change', render);

                // Button events
                document.getElementById('table').addEventListener('click', () => transform(targets.table, 2000));
                document.getElementById('sphere').addEventListener('click', () => transform(targets.sphere, 2000));
                document.getElementById('helix').addEventListener('click', () => transform(targets.helix, 2000));
                document.getElementById('grid').addEventListener('click', () => transform(targets.grid, 2000));

                transform(targets.table, 2000);

                window.addEventListener('resize', onWindowResize);
            }

            function transform(targets, duration) {
                TWEEN.removeAll();
                for (let i = 0; i < objects.length; i++) {
                    const object = objects[i];
                    const target = targets[i];
                    new TWEEN.Tween(object.position)
                        .to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
                        .easing(TWEEN.Easing.Exponential.InOut)
                        .start();
                    new TWEEN.Tween(object.rotation)
                        .to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
                        .easing(TWEEN.Easing.Exponential.InOut)
                        .start();
                }
                new TWEEN.Tween(this)
                    .to({}, duration * 2)
                    .onUpdate(render)
                    .start();
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                render();
            }

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();
                controls.update();
            }

            function render() {
                renderer.render(scene, camera);
            }

        </script>
    </body>
</html>
